<div nz-row>
  <div nz-col [nzXs]="{span: 5, offset: 1}" [nzLg]="{span: 6, offset: 2}">
    <nz-card nzTitle="Total de calorias queimadas" style="background-color: aliceblue;">
      <p>{{dadosEstatistica.totalCaloriasQueimadas}} cal</p>
    </nz-card>
  </div>

  <div nz-col [nzXs]="{span: 11, offset: 1}" [nzLg]="{span: 6, offset: 2}">
    <nz-card nzTitle="Total de distância percorrida" style="background-color: aliceblue;">
      <p>{{dadosEstatistica.distancia | number: '1.1-1'}} Km</p>
    </nz-card>
  </div>

  <div nz-col [nzXs]="{span: 5, offset: 1}" [nzLg]="{span: 6, offset: 2}">
    <nz-card nzTitle="Total de passos dado" style="background-color: aliceblue;">
      <p>{{dadosEstatistica.passos}}</p>
    </nz-card>
  </div>
</div>

<div nz-row style="margin-top: 20px;">

  <div nz-col [nzXs]="{span: 5, offset: 1}" [nzLg]="{span: 6, offset: 2}">
    <nz-card nzTitle="Tempo total gasto" style="background-color: aliceblue;">
      <p>{{dadosEstatistica.duracao}} min</p>
    </nz-card>
  </div>

  <div nz-col [nzXs]="{span: 5, offset: 1}" [nzLg]="{span: 6, offset: 2}">
    <nz-card nzTitle="Metas alcançadas" style="background-color: aliceblue;">
      <p>{{dadosEstatistica.metasAlcancadas}}</p>
    </nz-card>
  </div>

  <div nz-col [nzXs]="{span: 5, offset: 1}" [nzLg]="{span: 6, offset: 2}">
    <nz-card nzTitle="Metas não alcançadas" style="background-color: aliceblue;">
      <p>{{dadosEstatistica.metasNaoAlcancadas}}</p>
    </nz-card>
  </div>

</div>
